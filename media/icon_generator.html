<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokenLens Icon</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111318;
        }
        canvas {
            box-shadow: 0 0 20px rgba(79, 140, 255, 0.2);
        }
    </style>
</head>
<body>
    <canvas id="iconCanvas" width="128" height="128"></canvas>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = '#111318';
        ctx.fillRect(0, 0, 128, 128);

        // Lens Body (Outer Circle)
        ctx.beginPath();
        ctx.arc(64, 64, 48, 0, Math.PI * 2);
        ctx.strokeStyle = '#4f8cff';
        ctx.lineWidth = 6;
        ctx.stroke();

        // Inner Gradient for "Glass" effect
        const gradient = ctx.createRadialGradient(64, 64, 10, 64, 64, 45);
        gradient.addColorStop(0, 'rgba(79, 140, 255, 0.1)');
        gradient.addColorStop(1, 'rgba(79, 140, 255, 0.0)');
        ctx.fillStyle = gradient;
        ctx.fill();

        // Data Visualization (Bar Chart inside the lens)
        const barWidth = 8;
        const barGap = 4;
        const startX = 64 - (barWidth * 3 + barGap * 2) / 2;
        const bars = [20, 35, 15]; // Heights relative to a baseline

        ctx.fillStyle = '#35c46a';
        bars.forEach((height, i) => {
            const x = startX + i * (barWidth + barGap);
            const y = 64 + 15 - height; // Centered vertically
            ctx.fillRect(x, y, barWidth, height);
        });

        // Line Graph overlay
        ctx.beginPath();
        ctx.moveTo(startX, 64 + 15 - 20);
        ctx.lineTo(startX + barWidth + barGap, 64 + 15 - 35);
        ctx.lineTo(startX + 2 * (barWidth + barGap), 64 + 15 - 15);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Handle of the magnifying glass
        ctx.beginPath();
        ctx.moveTo(98, 98); // Bottom right of the circle
        ctx.lineTo(115, 115); // End of handle
        ctx.strokeStyle = '#4f8cff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Small reflection highlight on the lens
        ctx.beginPath();
        ctx.arc(50, 50, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();

    </script>
</body>
</html>
